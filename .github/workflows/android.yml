# Android アプリ（Capacitor）がビルドできるかを、PR と main への push のたびに確かめる。
# できたデバッグ版 APK は、実行結果のページの Artifacts からダウンロードできる。
name: Android ビルド

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# リポジトリを読むだけ。書き込みの権限は渡さない。
permissions:
  contents: read

# 同じブランチで新しく push されたら、古い実行は止める。
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: デバッグ版 APK をビルド
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22 # Capacitor 8 は Node.js 22 以上が必要

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21 # Capacitor 8 は JDK 21 が必要
          cache: gradle

      - name: 依存パッケージを入れる
        run: npm ci

      - name: Web 版を Android プロジェクトにコピーする
        run: npm run sync

      - name: APK をビルドする
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: APK をダウンロードできるようにする
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
